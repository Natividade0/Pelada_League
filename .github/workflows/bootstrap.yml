name: Pelada League Android 0.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'apply-v03.sh'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Restore and upgrade source
        run: |
          cat payload/part[0-9][0-9].txt | base64 --decode | tar -xJ
          sh repair-gradle.sh
          python3 -m pip install --quiet pillow
          python3 make_assets.py
          sh apply-v02.sh
          sh apply-v03.sh
      - name: Unit tests
        run: sh scripts/test-core.sh
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PeladaLeague-0.3-debug
          path: app/build/outputs/apk/debug/*.apk
